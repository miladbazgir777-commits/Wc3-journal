name: Build WC3 Journal APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'WC3_Journal_V10_Android_Source.zip'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract WC3 Journal V10
        shell: bash
        run: |
          set -euo pipefail
          test -s WC3_Journal_V10_Android_Source.zip || { echo 'Upload WC3_Journal_V10_Android_Source.zip to the repository root first.'; exit 1; }
          unzip -q WC3_Journal_V10_Android_Source.zip -d extracted
          test -f extracted/WC3Journal_AndroidStudio/app/build.gradle
          mkdir -p project
          cp -a extracted/WC3Journal_AndroidStudio/. project/
          test -s project/app/src/main/assets/index.html
          test -s project/download_icons.py
      - name: Bundle original Classic portraits and ability icons for offline use
        shell: bash
        run: python3 -u project/download_icons.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile Android installer
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare installer and portable HTML
        shell: bash
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk WC3-Journal-V10.apk
          cp project/app/src/main/assets/index.html WC3-Journal-V10-Offline.html
          test -s WC3-Journal-V10.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WC3-Journal-V10-Installer
          path: WC3-Journal-V10.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: WC3-Journal-V10-Offline-HTML
          path: WC3-Journal-V10-Offline.html
          if-no-files-found: error
          retention-days: 30
